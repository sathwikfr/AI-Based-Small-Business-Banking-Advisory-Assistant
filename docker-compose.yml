version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vantage_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vantage
      POSTGRES_PASSWORD: vantage_dev
      POSTGRES_DB: vantage
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vantage -d vantage']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
